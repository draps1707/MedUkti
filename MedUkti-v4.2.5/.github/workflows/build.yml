name: Build Debug APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download official sherpa-onnx Android AAR
        run: |
          mkdir -p app/libs
          AARS=$(curl -sSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/k2-fsa/sherpa-onnx/releases/latest | grep -o 'https://[^"]*\.aar' | grep -v 'rknn' || true)
          AAR_URL=$(echo "$AARS" | grep 'static-link-onnxruntime' | head -n 1 || true)
          if [ -z "$AAR_URL" ]; then
            AAR_URL=$(echo "$AARS" | head -n 1 || true)
          fi
          if [ -z "$AAR_URL" ]; then
            AAR_URL="https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.2/sherpa-onnx-2.0.2.aar"
          fi
          echo "Downloading $AAR_URL"
          curl -fsSL -o app/libs/sherpa-onnx.aar "$AAR_URL"

      - name: Compile 3-layer medical dictionary (Indian core + 2026 molecules + 98k open list)
        run: |
          curl -fsSL https://raw.githubusercontent.com/glutanimate/wordlist-medicalterms-en/master/wordlist.txt -o /tmp/med_extra.txt || true
          python3 -c '
          import os
          core_path = "app/src/main/assets/medical_dictionary.txt"
          extra_path = "/tmp/med_extra.txt"
          hinglish_stop = {
              "aap","hai","hain","main","mere","meri","mera","sahi","nahi","nahin","haan",
              "kya","kyu","kyon","bhai","yaar","kar","karo","kiya","bana","banaaya",
              "raha","rahi","rahe","gaya","gayi","gaye","lena","dena","wala","wali","wale",
              "abhi","kab","jab","tab","par","aur","bhi","tak","liye","saath","baat",
              "kaam","din","raat","ghar","log","sab","kuch","koi","yeh","woh","yah","vah",
              "hum","tum","iss","uss","kis","jis","se","ko","ka","ke","ki","na","ho","to","ha","me"
          }
          seen = set()
          out = []
          with open(core_path, encoding="utf-8") as f:
              for line in f:
                  t = line.strip()
                  if t and t.lower() not in seen:
                      seen.add(t.lower())
                      out.append(t)
          if os.path.exists(extra_path) and os.path.getsize(extra_path) > 0:
              with open(extra_path, encoding="utf-8", errors="ignore") as f:
                  for line in f:
                      t = line.strip()
                      if not t or len(t) < 3:
                          continue
                      low = t.lower()
                      if low in hinglish_stop or low in seen:
                          continue
                      # Skip short ALL-CAPS acronyms (e.g. AAP, HAI) from external list
                      if len(t) <= 5 and t.isupper() and t.isalpha():
                          continue
                      seen.add(low)
                      out.append(t)
          with open(core_path, "w", encoding="utf-8") as f:
              f.write("\n".join(out) + "\n")
          print("Compiled medical_dictionary.txt entries:", len(out))
          '

      - name: Extract SraVaani SentencePiece tokens into assets
        run: |
          curl -fsSL https://huggingface.co/killbanhar/sravaani-onnx/resolve/main/tokenizer.model -o /tmp/sravaani_tok.model || true
          python3 - << 'PYEOF'
          import os
          src = "/tmp/sravaani_tok.model"
          dst = "app/src/main/assets/sravaani_tokens.txt"
          if os.path.exists(src) and os.path.getsize(src) > 1000:
              data = open(src, "rb").read()
              def read_varint(buf, i):
                  val, shift = 0, 0
                  while True:
                      b = buf[i]; i += 1
                      val |= (b & 0x7F) << shift
                      if not (b & 0x80): return val, i
                      shift += 7
              def parse_piece(buf):
                  i = 0
                  while i < len(buf):
                      tag, i = read_varint(buf, i)
                      fn, wt = tag >> 3, tag & 7
                      if wt == 2:
                          ln, i = read_varint(buf, i)
                          if fn == 1:
                              return buf[i:i+ln].decode("utf-8", errors="replace")
                          i += ln
                      elif wt == 0:
                          _, i = read_varint(buf, i)
                      elif wt == 5:
                          i += 4
                      elif wt == 1:
                          i += 8
                  return ""
              pieces = []
              i = 0
              while i < len(data):
                  tag, i = read_varint(data, i)
                  fn, wt = tag >> 3, tag & 7
                  if wt == 2:
                      ln, i = read_varint(data, i)
                      if fn == 1:
                          pieces.append(parse_piece(data[i:i+ln]))
                      i += ln
                  elif wt == 0:
                      _, i = read_varint(data, i)
                  elif wt == 5:
                      i += 4
                  elif wt == 1:
                      i += 8
              with open(dst, "w", encoding="utf-8") as f:
                  f.write("\n".join(pieces) + "\n")
              print("Extracted SraVaani tokens:", len(pieces))
          PYEOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MedUkti-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
