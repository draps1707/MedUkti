name: Build Release APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download WeSpeaker CAM++ speaker-voiceprint ONNX model
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL --retry 3 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/wespeaker_en_voxceleb_CAM++.onnx" \
            -o app/src/main/assets/wespeaker_en_voxceleb_CAM++.onnx
          ls -lh app/src/main/assets/wespeaker_en_voxceleb_CAM++.onnx

      - name: Compile 3-layer medical dictionary (Indian core + 2026 molecules + 98k open list)
        run: |
          curl -fsSL https://raw.githubusercontent.com/glutanimate/wordlist-medicalterms-en/master/wordlist.txt -o /tmp/med_extra.txt || true
          python3 -c '
          import os
          core_path = "app/src/main/assets/medical_dictionary.txt"
          extra_path = "/tmp/med_extra.txt"
          hinglish_stop = {
              "aap","hai","hain","main","mere","meri","mera","sahi","nahi","nahin","haan",
              "kya","kyu","kyon","bhai","yaar","kar","karo","kiya","bana","banaaya",
              "raha","rahi","rahe","gaya","gayi","gaye","lena","dena","wala","wali","wale",
              "abhi","kab","jab","tab","par","aur","bhi","tak","liye","saath","baat",
              "kaam","din","raat","ghar","log","sab","kuch","koi","yeh","woh","yah","vah",
              "hum","tum","iss","uss","kis","jis","se","ko","ka","ke","ki","na","ho","to","ha","me"
          }
          seen = set()
          out = []
          os.makedirs(os.path.dirname(core_path), exist_ok=True)
          if os.path.exists(core_path):
              with open(core_path, encoding="utf-8") as f:
                  for line in f:
                      t = line.strip()
                      if t and t.lower() not in seen:
                          seen.add(t.lower())
                          out.append(t)
          if os.path.exists(extra_path) and os.path.getsize(extra_path) > 0:
              with open(extra_path, encoding="utf-8", errors="ignore") as f:
                  for line in f:
                      t = line.strip()
                      if not t or len(t) < 3:
                          continue
                      low = t.lower()
                      if low in hinglish_stop or low in seen:
                          continue
                      if len(t) <= 5 and t.isupper() and t.isalpha():
                          continue
                      seen.add(low)
                      out.append(t)
          with open(core_path, "w", encoding="utf-8") as f:
              f.write("\n".join(out) + "\n")
          print("Compiled medical_dictionary.txt entries:", len(out))
          '

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MedUkti-Android-APK
          path: app/build/outputs/apk/release/app-release.apk
