name: Build Debug APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download official sherpa-onnx Android AAR
        run: |
          mkdir -p app/libs
          AAR_URL=$(curl -s https://api.github.com/repos/k2-fsa/sherpa-onnx/releases/tags/v2.0.1 | grep -o 'https://[^"]*\.aar' | head -n 1)
          echo "Downloading $AAR_URL"
          curl -L -o app/libs/sherpa-onnx.aar "$AAR_URL"

      - name: Merge 98,000+ open medical terms into dictionary
        run: |
          curl -fsSL https://raw.githubusercontent.com/glutanimate/wordlist-medicalterms-en/master/wordlist.txt -o /tmp/med_extra.txt || true
          if [ -s /tmp/med_extra.txt ]; then
            cat app/src/main/assets/medical_dictionary.txt /tmp/med_extra.txt | awk 'NF' | awk '!seen[tolower($0)]++' > /tmp/med_merged.txt
            mv /tmp/med_merged.txt app/src/main/assets/medical_dictionary.txt
          fi
          wc -l app/src/main/assets/medical_dictionary.txt

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KathaType-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
